:root {

<body>
<main class="stage" id="stage" aria-label="3D-figur med reklamytor. Klicka på en yta på kläderna för att buda.">
  <div class="floor"></div>
  <div class="loading glass" id="fig-loading">Laddar figuren…</div>
  <p class="hint glass" id="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.9-2.6L4.3 15a1.5 1.5 0 0 1 2.4-1.8L9 15.5"/></svg>
    Klicka på en yta på kläderna för att buda
  </p>
</main>

<aside class="sheet" id="sheet" aria-label="Lägg bud" aria-hidden="true" tabindex="-1">
  <div class="grab" id="grab"></div>
  <button class="close" id="close" type="button" aria-label="Stäng">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="detail" id="detail" aria-live="polite">
    <p class="eyebrow" id="d-meta">Tröja · 30 × 20 cm</p>
    <h2 id="d-name">Bröst</h2>
    <div class="price">
      <span><span class="lbl" id="d-lbl">Utropspris</span><span class="amt" id="d-amt">5 000 kr</span></span>
      <span id="d-chip" class="chip free">Ledig</span>
    </div>
    <p class="leader" id="d-leader">Inga bud ännu.</p>
    <form id="bid-form" novalidate>
      <label for="brand">Företag eller varumärke som ska synas
        <input id="brand" name="brand" maxlength="24" autocomplete="organization" placeholder="t.ex. Kaffebaren Norr" required>
      </label>
      <label for="amount">Ditt bud (kr)
        <span class="amount-row">
          <input id="amount" name="amount" type="number" inputmode="numeric" step="50" required>
        </span>
      </label>
      <div class="quick" aria-label="Snabbval för budet">
        <button class="pill" type="button" id="min-btn">Lägsta</button>
        <button class="pill" type="button" data-inc="100">+100</button>
        <button class="pill" type="button" data-inc="500">+500</button>
        <button class="pill" type="button" data-inc="1000">+1 000</button>
      </div>
      <span class="help" id="min-help">Lägsta bud 5 000 kr</span>
      <button class="btn-primary" id="submit" type="submit">Lägg bud</button>
      <p class="msg" id="msg"></p>
    </form>
    <ul class="history" id="history"></ul>
  </div>
  <p class="note" id="sync-note">Ansluter till budlistan…</p>
  <p class="ends" id="st-end"></p>

<script>
const PI = Math.PI;
const SPOTS = [
  { id: 'brost',    name: 'Bröst',           garment: 'Tröja', size: '30 × 20 cm', start: 5000, layer: 'shirt', o: [0, 1.33, 1],         d: [0, 0, -1], w: 0.24,  h: 0.15, depth: 0.1,  tc: 0 },
  { id: 'mage',     name: 'Mage',            garment: 'Tröja', size: '30 × 14 cm', start: 2500, layer: 'shirt', o: [0, 1.12, 1],         d: [0, 0, -1], w: 0.22,  h: 0.12, depth: 0.1,  tc: 0 },
  { id: 'rygg',     name: 'Rygg',            garment: 'Tröja', size: '34 × 30 cm', start: 4000, layer: 'shirt', o: [0, 1.25, -1],        d: [0, 0, 1],  w: 0.27,  h: 0.24, depth: 0.1,  tc: PI },
  { id: 'arm-v',    name: 'Vänster ärm',     garment: 'Tröja', size: '10 × 18 cm', start: 1500, layer: 'shirt', o: [1, 1.384, 0.025],    d: [-1, 0, 0], w: 0.07,  h: 0.09, depth: 0.06, tc: PI / 2 },
  { id: 'arm-h',    name: 'Höger ärm',       garment: 'Tröja', size: '10 × 18 cm', start: 1500, layer: 'shirt', o: [-1, 1.369, 0.026],   d: [1, 0, 0],  w: 0.07,  h: 0.09, depth: 0.06, tc: -PI / 2 },
  { id: 'lar-v',    name: 'Vänster lår',     garment: 'Byxor', size: '12 × 22 cm', start: 2000, layer: 'pants', o: [0.142, 0.66, 1],     d: [0, 0, -1], w: 0.09,  h: 0.15, depth: 0.08, tc: 0.05 },
  { id: 'lar-h',    name: 'Höger lår',       garment: 'Byxor', size: '12 × 22 cm', start: 2000, layer: 'pants', o: [-0.142, 0.66, 1],    d: [0, 0, -1], w: 0.09,  h: 0.15, depth: 0.08, tc: -0.05 },
  { id: 'ben-v',    name: 'Vänster smalben', garment: 'Byxor', size: '10 × 20 cm', start: 1000, layer: 'pants', o: [0.167, 0.28, 1],     d: [0, 0, -1], w: 0.075, h: 0.13, depth: 0.07, tc: 0.1 },
  { id: 'ben-h',    name: 'Höger smalben',   garment: 'Byxor', size: '10 × 20 cm', start: 1000, layer: 'pants', o: [-0.174, 0.28, 1],    d: [0, 0, -1], w: 0.075, h: 0.13, depth: 0.07, tc: -0.1 },
  { id: 'bakficka', name: 'Bakficka',        garment: 'Byxor', size: '14 × 12 cm', start: 1200, layer: 'pants', o: [0.085, 0.86, -1],    d: [0, 0, 1],  w: 0.09,  h: 0.075, depth: 0.06, tc: PI - 0.4 },
];
const kr = n => Math.round(n).toLocaleString('sv-SE') + ' kr';

window.Fig = (() => {
  THREE.ColorManagement.legacyMode = false;
  const stage = document.getElementById('stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const cv = renderer.domElement;
  cv.style.position = 'relative'; cv.style.zIndex = '1';
  cv.setAttribute('aria-hidden', 'true');
  stage.prepend(cv);
  stage.querySelectorAll('.hud, .legend').forEach(el => el.style.zIndex = '2');

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
  camera.position.set(0, 1.1, 4.3);
  const controls = new THREE.OrbitControls(camera, cv);
  controls.target.set(0, 0.9, 0);
  Object.assign(controls, { enablePan: false, enableDamping: true, dampingFactor: 0.08, minDistance: 1.2, maxDistance: 5.5,
    minPolarAngle: 0.5, maxPolarAngle: 1.85, autoRotate: !reduce, autoRotateSpeed: 1.1 });
  let tween = null;
  controls.addEventListener('start', () => { controls.autoRotate = false; tween = null; });

  scene.add(new THREE.HemisphereLight(0xf4f6ff, 0x6b6560, 0.35));
  const key = new THREE.DirectionalLight(0xfff4e8, 1.6);
  key.position.set(1.6, 3.2, 2.4); key.castShadow = true;
  Object.assign(key.shadow.camera, { left: -0.9, right: 0.9, top: 2.1, bottom: -0.2, near: 0.5, far: 8 });
  key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xdfe8ff, 0.7); rim.position.set(-2, 2.4, -2.6); scene.add(rim);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ opacity: 0.22 }));
  ground.rotation.x = -PI / 2; ground.receiveShadow = true; scene.add(ground);

  function fabricMap(kind) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 9000; i++) {
      const v = 100 + Math.random() * 56 | 0; g.fillStyle = `rgb(${v},${v},${v})`;
      g.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5);
    }
    g.lineWidth = 1.2;
    if (kind === 'denim') {
      for (let k = -256; k < 256; k += 4) { g.strokeStyle = `rgba(${((((k + 512) % 256) / 4) * 37) % 11 < 5 ? '255,255,255' : '0,0,0'},.3)`; g.beginPath(); g.moveTo(k, 256); g.lineTo(k + 256, 0); g.stroke(); }
    } else if (kind === 'knit') {
      for (let y = 0; y < 256; y += 4) for (let x = 0; x < 256; x += 4) {
        g.strokeStyle = 'rgba(255,255,255,.28)'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 2, y + 3); g.lineTo(x + 4, y); g.stroke();
      }
    }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(kind === 'hair' ? 25 : 10, kind === 'hair' ? 25 : 10); t.anisotropy = 4;
    return t;
  }
  const knit = fabricMap('knit'), denim = fabricMap('denim'), strands = fabricMap('hair');

  const shirt = new THREE.MeshPhysicalMaterial({ color: 0xf1f0eb, roughness: 0.92, sheen: 0.6, sheenRoughness: 0.8, sheenColor: 0xffffff,
    bumpMap: knit, bumpScale: 0.012, side: THREE.DoubleSide });
  const pants = new THREE.MeshPhysicalMaterial({ color: 0x3a4d73, roughness: 0.88, sheen: 0.5, sheenRoughness: 0.7, sheenColor: 0x6b82b3,
    bumpMap: denim, bumpScale: 0.004, side: THREE.DoubleSide });
  const skin = new THREE.MeshPhysicalMaterial({ color: 0xd59d7c, roughness: 0.55, sheen: 0.35, sheenRoughness: 0.5, sheenColor: 0xff9f86, clearcoat: 0.04 });
  skin.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vSkinPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvSkinPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
varying vec3 vSkinPos;
float skHash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float skNoise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(skHash(i), skHash(i + vec3(1, 0, 0)), f.x), mix(skHash(i + vec3(0, 1, 0)), skHash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(skHash(i + vec3(0, 0, 1)), skHash(i + vec3(1, 0, 1)), f.x), mix(skHash(i + vec3(0, 1, 1)), skHash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
vec3 skGrad(vec3 p) { float e = 0.35, n = skNoise(p); return vec3(skNoise(p + vec3(e, 0, 0)) - n, skNoise(p + vec3(0, e, 0)) - n, skNoise(p + vec3(0, 0, e)) - n); }`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
{
  vec3 g = skGrad(vSkinPos * 1400.0) * 0.32 + skGrad(vSkinPos * 260.0) * 0.22;
  vec3 gv = (viewMatrix * vec4(g, 0.0)).xyz;
  normal = normalize(normal - (gv - dot(gv, normal) * normal));
}`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
roughnessFactor *= 0.85 + 0.3 * skNoise(vSkinPos * 90.0);`);
  };
  const lipMat = new THREE.MeshPhysicalMaterial({ color: 0xb06a62, roughness: 0.4, clearcoat: 0.2 });
  const hair = new THREE.MeshStandardMaterial({ color: 0x4a3120, roughness: 0.75, bumpMap: strands, bumpScale: 0.02 });
  const shoeMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.62, clearcoat: 0.15 });
  const soleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75 });
  const eyeWhite = new THREE.MeshPhysicalMaterial({ color: 0xe6ded5, roughness: 0.15, clearcoat: 1 });
  function irisTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'), m = 128;
    const base = g.createRadialGradient(m, m, 20, m, m, 128);
    base.addColorStop(0, '#2a1a0e'); base.addColorStop(0.3, '#6b4a2a'); base.addColorStop(0.75, '#4e3a26'); base.addColorStop(0.93, '#2e2418'); base.addColorStop(1, '#141010');
    g.fillStyle = base; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 420; i++) {
      const a = Math.random() * Math.PI * 2, r0 = 40 + Math.random() * 20, r1 = 90 + Math.random() * 30, l = Math.random();
      g.strokeStyle = l > 0.5 ? `rgba(196,150,96,${0.15 + 0.25 * Math.random()})` : `rgba(20,12,6,${0.2 + 0.3 * Math.random()})`;
      g.lineWidth = 0.8 + Math.random() * 1.4; g.beginPath();
      g.moveTo(m + Math.cos(a) * r0, m + Math.sin(a) * r0);
      g.quadraticCurveTo(m + Math.cos(a + 0.08) * (r0 + r1) / 2, m + Math.sin(a + 0.08) * (r0 + r1) / 2, m + Math.cos(a) * r1, m + Math.sin(a) * r1); g.stroke();
    }
    g.fillStyle = '#060404'; g.beginPath(); g.arc(m, m, 44, 0, Math.PI * 2); g.fill();
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  function strandTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    const fade = (x0) => { const gr = g.createLinearGradient(0, 256, 0, 0); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.7, 'rgba(255,255,255,0.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); return gr; };
    for (let i = 0; i < 16; i++) {
      const x = 3 + Math.random() * 58, top = 256 * (0.02 + Math.random() * 0.25);
      g.strokeStyle = fade(); g.globalAlpha = 0.6 + Math.random() * 0.4; g.lineWidth = 1.6 + Math.random() * 1.8;
      g.beginPath(); g.moveTo(x, 256); g.quadraticCurveTo(x + (Math.random() - 0.5) * 6, 128, x + (Math.random() - 0.5) * 10, top); g.stroke();
    }
    g.globalAlpha = 1; g.strokeStyle = fade(); g.lineWidth = 7;
    g.beginPath(); g.moveTo(160, 256); g.lineTo(160, 12); g.stroke();
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
  }
  const irisMat = new THREE.MeshPhysicalMaterial({ map: irisTexture(), roughness: 0.35 });
  const corneaMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.0, transmission: 1, thickness: 0.0005, ior: 1.376, clearcoat: 1, clearcoatRoughness: 0 });
  const strandMat = new THREE.MeshStandardMaterial({ color: 0x5e3f27, map: strandTexture(), alphaTest: 0.35, side: THREE.DoubleSide, roughness: 0.5 });
  const beltMat = new THREE.MeshPhysicalMaterial({ color: 0x5a3a24, roughness: 0.5, clearcoat: 0.3 });

  function shade(m) { m.castShadow = true; m.receiveShadow = true; return m; }
  const sph = (r, mat) => shade(new THREE.Mesh(new THREE.SphereGeometry(r, 32, 20), mat));

  const fig = new THREE.Group(); scene.add(fig);
  const eyeTex = new THREE.TextureLoader().load('eye.png', () => { dirty = true; });
  eyeTex.encoding = THREE.sRGBEncoding; eyeTex.anisotropy = 8;
  const eyeMat = new THREE.MeshPhysicalMaterial({ map: eyeTex, roughness: 0.08, clearcoat: 1, clearcoatRoughness: 0.03 });
  const corneaLayer = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.08, roughness: 0, clearcoat: 1, clearcoatRoughness: 0, depthWrite: false });
  const layerMats = { skin, face: skin, arms: skin, eyes: eyeMat, cornea: corneaLayer, shirt, pants, shoes: shoeMat, soles: soleMat, hair, strands: strandMat };
  for (const m of Object.values(layerMats)) m.vertexColors = true;
  skin.color.set(0xffffff);
  const meshes = {}, patches = new Map(), leaders = new Map();
  const loading = document.getElementById('fig-loading');

  function decode(buf) {
    const hl = new DataView(buf).getUint32(0, true);
    const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, hl)));
    const base = 4 + hl;
    for (const L of header.layers) {
      const g = new THREE.BufferGeometry(), n = L.vcount;
      const q = new Uint16Array(buf, base + L.pos, n * 3), p = new Float32Array(n * 3);
      for (let i = 0; i < n * 3; i++) { const a = i % 3; p[i] = L.lo[a] + q[i] / 65535 * (L.hi[a] - L.lo[a]); }
      g.setAttribute('position', new THREE.BufferAttribute(p, 3));
      g.setAttribute('normal', new THREE.BufferAttribute(new Int8Array(buf, base + L.nrm, n * 3), 3, true));
      const c8 = new Uint8Array(buf, base + L.col, n * 3);
      g.setAttribute('color', new THREE.BufferAttribute(Float32Array.from(c8, v => (v / 255) ** 2.2), 3));
      if (L.uv != null) g.setAttribute('uv', new THREE.BufferAttribute(Float32Array.from(new Int16Array(buf, base + L.uv, n * 2), v => v / 1000), 2));
      let ix;
      if (L.delta) { const dl = new Int32Array(buf, base + L.idx, L.icount); ix = new Uint32Array(L.icount); let acc = 0; for (let i = 0; i < L.icount; i++) ix[i] = acc += dl[i]; }
      else ix = L.idx32 ? new Uint32Array(buf, base + L.idx, L.icount) : new Uint16Array(buf, base + L.idx, L.icount);
      g.setIndex(new THREE.BufferAttribute(ix, 1));
      g.computeBoundingSphere();
      fig.add(meshes[L.name] = shade(new THREE.Mesh(g, layerMats[L.name])));
      if (L.name === 'strands') meshes[L.name].castShadow = false;
    }
    const em = new THREE.Matrix4(), M = header.eyeMatrix, R = header.eyeR;
    if (M) em.set(M[0][0], M[0][1], M[0][2], 0, M[1][0], M[1][1], M[1][2], 0, M[2][0], M[2][1], M[2][2], 0, 0, 0, 0, 1);
    for (const c of header.eyes || []) {
      const eye = new THREE.Group(); eye.position.set(c[0], c[1], c[2]); eye.setRotationFromMatrix(em); fig.add(eye);
      eye.add(sph(R, eyeWhite));
      const iris = new THREE.Mesh(new THREE.CircleGeometry(R * 0.5, 48), irisMat); iris.position.z = R * 0.87; eye.add(iris);
      const cornea = new THREE.Mesh(new THREE.SphereGeometry(R * 0.56, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.42), corneaMat);
      cornea.rotation.x = Math.PI / 2; cornea.position.z = R * 0.5; eye.add(cornea);
    }
  }

  const helper = new THREE.Object3D(), caster = new THREE.Raycaster();
  function buildPatches() {
    for (const sp of SPOTS) {
      const target = meshes[sp.layer];
      if (!target) continue;
      const o = new THREE.Vector3(...sp.o), d = new THREE.Vector3(...sp.d).normalize();
      caster.set(o, d);
      const hit = caster.intersectObject(target, false)[0];
      if (!hit) continue;
      helper.position.copy(hit.point); helper.lookAt(hit.point.clone().sub(d));
      const geo = new THREE.DecalGeometry(target, hit.point, helper.rotation.clone(), new THREE.Vector3(sp.w, sp.h, sp.depth));
      const canvas = document.createElement('canvas');
      canvas.height = 256; canvas.width = Math.round(256 * sp.w / sp.h);
      const tex = new THREE.CanvasTexture(canvas);
      tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8;
      const mat = new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.85, emissive: 0x2b48ff, emissiveIntensity: 0,
        polygonOffset: true, polygonOffsetFactor: -4, depthWrite: false });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.receiveShadow = true; mesh.userData.id = sp.id; mesh.renderOrder = 2;
      fig.add(mesh);
      patches.set(sp.id, { mesh, canvas, ctx: canvas.getContext('2d'), tex, sp });
      drawPatch(sp.id, leaders.get(sp.id) || null);
    }
    highlight();
  }

  fetch('figure.bin.gz')
    .then(r => { if (!r.ok) throw new Error(r.status); return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(); })
    .then(buf => { decode(buf); buildPatches(); dirty = true; if (loading) loading.hidden = true; })
    .catch(() => { if (loading) loading.textContent = 'Figuren kunde inte laddas. Ladda om sidan.'; });

  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function fit(ctx, text, weight, family, max, maxW) {
    let s = max;
    do { ctx.font = `${weight} ${s}px ${family}`; s -= 4; } while (ctx.measureText(text).width > maxW && s > 18);
  }
  const DISPLAY = '"Archivo", "Arial Narrow", sans-serif', MONO = '"JetBrains Mono", monospace';
  function drawPatch(id, leader) {
    leaders.set(id, leader);
    if (!patches.has(id)) return;
    const { canvas: c, ctx, tex, sp } = patches.get(id);
    const W = c.width, H = c.height, m = 8, onShirt = sp.garment === 'Tröja';
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    try { ctx.fontStretch = 'condensed'; } catch (e) {}
    if (leader) {
      const ink = onShirt ? '#1b2130' : '#f3f1ea';
      ctx.fillStyle = ink;
      const text = leader.brand.toUpperCase(), words = text.split(/\s+/);
      fit(ctx, text, 900, DISPLAY, 130, W * 0.8);
      if (parseFloat(ctx.font.match(/([\d.]+)px/)[1]) < H * 0.24 && words.length > 1) {
        let best = 1, diff = Infinity;
        for (let i = 1; i < words.length; i++) { const d = Math.abs(words.slice(0, i).join(' ').length - words.slice(i).join(' ').length); if (d < diff) { diff = d; best = i; } }
        const l1 = words.slice(0, best).join(' '), l2 = words.slice(best).join(' ');
        fit(ctx, l1.length > l2.length ? l1 : l2, 900, DISPLAY, 82, W * 0.82);
        ctx.fillText(l1, W / 2, H * 0.27); ctx.fillText(l2, W / 2, H * 0.55);
      } else ctx.fillText(text, W / 2, H * 0.44);
      ctx.globalAlpha = 0.75; ctx.fillRect(W * 0.3, H * 0.66, W * 0.4, 3);
      ctx.font = `700 30px ${MONO}`; ctx.fillText(kr(leader.amount), W / 2, H * 0.8); ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = 'rgba(233,237,255,0.88)'; rr(ctx, m, m, W - 2 * m, H - 2 * m, 16); ctx.fill();
      ctx.strokeStyle = '#2b48ff'; ctx.lineWidth = 6; ctx.setLineDash([18, 12]);
      rr(ctx, m + 4, m + 4, W - 2 * m - 8, H - 2 * m - 8, 13); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#2b48ff';
      fit(ctx, 'LEDIG', 900, DISPLAY, 96, W - 48);
      ctx.fillText('LEDIG', W / 2, H * 0.42);
      fit(ctx, 'från ' + kr(sp.start), 700, MONO, 34, W - 40);
      ctx.fillText('från ' + kr(sp.start), W / 2, H * 0.74);
    }
    tex.needsUpdate = true; dirty = true;
  }

  let hovered = null, selected = null, dirty = true;
  function highlight() {
    dirty = true;
    for (const [id, p] of patches) p.mesh.material.emissiveIntensity = id === selected ? 0.5 : id === hovered ? 0.28 : 0;
  }
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  function pick(e) {
    const r = cv.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects([fig], true);
    if (!hits.length) return null;
    const near = hits.find(h => h.object.userData.id && h.distance - hits[0].distance < 0.012);
    return near ? near.object.userData.id : null;
  }
  cv.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const id = pick(e);
    if (id !== hovered) { hovered = id; cv.classList.toggle('hover', !!id); highlight(); }
  });
  cv.addEventListener('pointerleave', () => { hovered = null; cv.classList.remove('hover'); highlight(); });
  let down = null;
  cv.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  cv.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
    const id = pick(e);
    if (api.onPick) api.onPick(id);
  });

  function focusAngle(a) {
    controls.autoRotate = false;
    const off = camera.position.clone().sub(controls.target);
    const from = Math.atan2(off.x, off.z);
    let d = a - from; d = Math.atan2(Math.sin(d), Math.cos(d));
    tween = { from, d, t: reduce ? 1 : 0, rad: Math.hypot(off.x, off.z), y: off.y };
  }

  let vw = 1, vh = 1;
  const off = [0, 0], offT = [0, 0];
  function resize() {
    dirty = true;
    const w = vw = stage.clientWidth, h = vh = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 38 : 30;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (tween) {
      tween.t = Math.min(1, tween.t + dt / 0.7);
      const e = 1 - Math.pow(1 - tween.t, 3), a = tween.from + tween.d * e;
      camera.position.set(controls.target.x + Math.sin(a) * tween.rad, controls.target.y + tween.y, controls.target.z + Math.cos(a) * tween.rad);
      if (tween.t >= 1) tween = null;
    }
    let moved = !!tween;
    if (Math.abs(offT[0] - off[0]) + Math.abs(offT[1] - off[1]) > 0.05) {
      for (let i = 0; i < 2; i++) off[i] += (offT[i] - off[i]) * (reduce ? 1 : Math.min(1, dt * 8));
      if (Math.abs(off[0]) + Math.abs(off[1]) > 0.5) camera.setViewOffset(vw, vh, off[0], off[1], vw, vh);
      else if (camera.view && camera.view.enabled) camera.clearViewOffset();
      moved = true;
    }
    if (controls.update()) moved = true;
    if (moved || dirty) { renderer.render(scene, camera); dirty = false; }
    requestAnimationFrame(loop);
  })(last);

  const api = {
    drawPatch, onPick: null,
    select(id) { selected = id; highlight(); },
    focus(id) { focusAngle(SPOTS.find(s => s.id === id).tc); },
    face(a) { focusAngle(a); },
    inset(x, y) { offT[0] = x; offT[1] = y; },
  };
  return api;
})();
</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const END = new Date('2026-11-30T20:00:00+01:00');
  const LOCAL_KEY = 'reklamfiguren-bids', BRAND_KEY = 'reklamfiguren-brand';
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  let bidsByUser = new Map();
  let me = null, mode = 'connecting', canWrite = true, busy = false, remoteSave = null;
  let selected = 'brost';

  const ended = () => Date.now() > END.getTime();
  const reduceUI = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let shownKey = '';
  const step = a => a < 5000 ? 100 : 250;

  function clean(spots) {
    const out = {};
    if (!spots || typeof spots !== 'object') return out;
    for (const sp of SPOTS) {
      const b = spots[sp.id];
      if (b && typeof b.brand === 'string' && Number.isFinite(b.amount) && b.amount > 0)
        out[sp.id] = { brand: b.brand.trim().slice(0, 24) || 'Okänd', amount: Math.round(b.amount), t: Number(b.t) || 0 };
    }
    return out;
  }
  function ranking(id) {
    const list = [];
    for (const [uid, doc] of bidsByUser) { const b = clean(doc && doc.spots)[id]; if (b) list.push({ ...b, uid }); }
    return list.sort((a, b) => b.amount - a.amount || a.t - b.t);
  }
  const minBid = id => { const L = ranking(id)[0]; return L ? L.amount + step(L.amount) : SPOTS.find(s => s.id === id).start; };
  const myBid = id => me && bidsByUser.get(me) ? clean(bidsByUser.get(me).spots)[id] : null;

  function status(id) {
    const L = ranking(id)[0];
    if (L && me && L.uid === me) return ['mine', 'Du leder'];
    if (myBid(id)) return ['out', 'Överbjuden'];
    if (L) return ['taken', 'Har bud'];
    return ['free', 'Ledig'];
  }

  function renderList() {
    const box = $('list'); if (!box) return; box.textContent = '';
    for (const g of ['Tröja', 'Byxor']) {
      const sec = document.createElement('section');
      const h = document.createElement('h3'), items = SPOTS.filter(s => s.garment === g), cnt = document.createElement('span');
      cnt.textContent = `${items.filter(s => ranking(s.id)[0]).length} av ${items.length} har bud`;
      h.append(g, cnt); sec.append(h);
      for (const sp of SPOTS.filter(s => s.garment === g)) {
        const L = ranking(sp.id)[0], [cls, txt] = status(sp.id);
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'row'; b.dataset.id = sp.id;
        if (sp.id === selected) b.setAttribute('aria-current', 'true');
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = sp.name;
        const sm = document.createElement('small'); sm.textContent = L ? L.brand : sp.size; nm.append(sm);
        const ch = document.createElement('span'); ch.className = 'chip ' + cls; ch.textContent = txt;
        const am = document.createElement('span'); am.className = 'am'; am.textContent = L ? kr(L.amount) : kr(sp.start);
        if (!L) am.style.color = 'var(--muted)';
        b.append(nm, ch, am); sec.append(b);
      }
      box.append(sec);
    }
  }

  function renderDetail(resetAmount) {
    const sp = SPOTS.find(s => s.id === selected), rk = ranking(sp.id), L = rk[0], [cls, txt] = status(sp.id);
    $('d-meta').textContent = `${sp.garment} · ${sp.size}`;
    $('d-name').textContent = sp.name;
    $('d-lbl').textContent = L ? 'Ledande bud' : 'Utropspris';
    $('d-amt').textContent = kr(L ? L.amount : sp.start);
    const key = sp.id + ':' + (L ? L.amount : 0);
    if (shownKey.split(':')[0] === sp.id && shownKey !== key && !reduceUI)
      $('d-amt').animate([{ color: 'var(--lead)', transform: 'scale(1.04)' }, { color: 'var(--ink)', transform: 'none' }], { duration: 600, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    shownKey = key;
    $('d-chip').className = 'chip ' + cls; $('d-chip').textContent = txt;
    const ld = $('d-leader'); ld.textContent = '';
    if (L) { ld.append('Leds av '); const b = document.createElement('b'); b.textContent = L.brand; ld.append(b, ` · ${rk.length} ${rk.length === 1 ? 'bud' : 'bud totalt'}`); }
    else ld.textContent = 'Inga bud ännu. Första budet tar ytan.';
    const min = minBid(sp.id), amt = $('amount');
    amt.min = min;
    if (resetAmount || !amt.value || Number(amt.value) < min) amt.value = min;
    $('min-help').textContent = L ? `Lägsta bud ${kr(min)} (höjning minst ${kr(step(L.amount))})` : `Lägsta bud ${kr(min)}`;
    const hist = $('history'); hist.textContent = '';
    for (const b of rk.slice(0, 5)) {
      const li = document.createElement('li'), a = document.createElement('span'), c = document.createElement('span');
      a.textContent = b.brand + (me && b.uid === me ? ' (du)' : ''); c.textContent = kr(b.amount);
      li.append(a, c); hist.append(li);
    }
    const blocked = ended() || !canWrite || mode === 'connecting' || busy;
    $('submit').disabled = blocked;
    $('submit').textContent = ended() ? 'Auktionen är stängd' : `Lägg bud på ${kr(Number(amt.value) || min)}`;
  }

  function renderStats() {
    let n = 0, sum = 0;
    for (const sp of SPOTS) { const L = ranking(sp.id)[0]; if (L) { n++; sum += L.amount; } }
    const days = Math.ceil((END - Date.now()) / 864e5);
    $('st-end').textContent = ended() ? 'Auktionen är stängd.' : `Auktionen stänger 30 november kl. 20:00, om ${days} ${days === 1 ? 'dag' : 'dagar'}. ${n} av ${SPOTS.length} ytor har bud.`;
  }

  function render(resetAmount) {
    for (const sp of SPOTS) Fig.drawPatch(sp.id, ranking(sp.id)[0] || null);
    renderList(); renderDetail(resetAmount); renderStats();
  }

  const sheet = $('sheet'), phone = matchMedia('(max-width: 700px)');
  sheet.inert = true;
  function fitFigure() {
    if (!sheet.classList.contains('open')) return Fig.inset(0, 0);
    if (phone.matches) Fig.inset(0, Math.min(sheet.offsetHeight * 0.42, innerHeight * 0.3));
    else Fig.inset(Math.min((sheet.offsetWidth + 32) / 2, innerWidth * 0.22), 0);
  }
  function openSheet(id) {
    const wasOpen = sheet.classList.contains('open'), changed = id !== selected;
    selected = id; Fig.select(id);
    if (changed) { $('msg').textContent = ''; $('msg').className = 'msg'; }
    render(changed);
    if (wasOpen && changed && !reduceUI) $('detail').animate([{ opacity: 0.55, filter: 'blur(2px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 220, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    sheet.classList.add('open'); sheet.inert = false; sheet.setAttribute('aria-hidden', 'false');
    $('hint').classList.add('gone');
    if (!wasOpen && !phone.matches) sheet.focus({ preventScroll: true });
    requestAnimationFrame(fitFigure);
  }
  function closeSheet() {
    if (!sheet.classList.contains('open')) return;
    sheet.classList.remove('open'); sheet.inert = true; sheet.setAttribute('aria-hidden', 'true');
    sheet.style.transform = '';
    Fig.select(null); fitFigure();
  }
  Fig.onPick = id => id ? openSheet(id) : closeSheet();
  $('close').addEventListener('click', closeSheet);
  addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  addEventListener('resize', fitFigure);

  let drag = null;
  $('grab').addEventListener('pointerdown', e => {
    if (!phone.matches || drag) return;
    drag = { y: e.clientY, t: performance.now(), dy: 0, id: e.pointerId };
    $('grab').setPointerCapture(e.pointerId); sheet.classList.add('dragging');
  });
  $('grab').addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const raw = e.clientY - drag.y;
    drag.dy = raw > 0 ? raw : -Math.sqrt(-raw) * 2;
    sheet.style.transform = `translateY(${drag.dy}px)`;
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const v = drag.dy / (performance.now() - drag.t);
    sheet.classList.remove('dragging'); sheet.style.transform = '';
    if (drag.dy > 120 || v > 0.11) closeSheet();
    drag = null;
  };
  $('grab').addEventListener('pointerup', endDrag);
  $('grab').addEventListener('pointercancel', endDrag);
  $('min-btn').addEventListener('click', () => { $('amount').value = minBid(selected); renderDetail(false); });
  document.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
    const a = $('amount'); a.value = Math.max(Number(a.value) || 0, minBid(selected)) + Number(b.dataset.inc);
    a.dispatchEvent(new Event('input'));
  }));
  $('amount').addEventListener('input', () => {
    const v = Number($('amount').value);
    if (!ended()) $('submit').textContent = `Lägg bud på ${kr(v > 0 ? v : minBid(selected))}`;
  });
  $('brand').value = store.get(BRAND_KEY) || '';

  function say(text, ok) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }

  $('bid-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (busy || ended() || !canWrite) return;
    const brand = $('brand').value.trim().slice(0, 24), amount = Math.round(Number($('amount').value)), min = minBid(selected);
    if (!brand) { say('Skriv företaget eller varumärket som ska synas på ytan.'); $('brand').focus(); return; }
    if (!Number.isFinite(amount) || amount < min) { say(`Budet måste vara minst ${kr(min)}.`); $('amount').focus(); return; }
    const sp = SPOTS.find(s => s.id === selected);
    const mine = clean(bidsByUser.get(me) && bidsByUser.get(me).spots);
    mine[sp.id] = { brand, amount, t: Date.now() };
    busy = true; renderDetail(false);
    try {
      if (mode === 'shared') await remoteSave(sp.id, brand, amount);
      else { bidsByUser.set(me, { spots: mine }); store.set(LOCAL_KEY, JSON.stringify(mine)); }
      store.set(BRAND_KEY, brand);
      busy = false; render(true);
      say(`Ditt bud på ${kr(amount)} för ${sp.name.toLowerCase()} är registrerat.`, true);
    } catch (err) {
      busy = false;
      if (err && err.userMessage) say(err.userMessage);
      else say('Budet kunde inte sparas. Kontrollera anslutningen och försök igen.');
      renderDetail(false);
    }
  });

  function goLocal() {
    mode = 'local'; me = 'local';
    try { const saved = JSON.parse(store.get(LOCAL_KEY) || 'null'); if (saved) bidsByUser.set('local', { spots: saved }); } catch (e) {}
    $('sync-note').textContent = 'Den delade budlistan är inte tillgänglig här, så dina bud sparas bara i den här webbläsaren.';
    render(true);
  }

  render(true);
  if (document.fonts) document.fonts.ready.then(() => render(false));
  setInterval(renderStats, 60000);

  const SUPABASE_URL = 'https://lplhdmrzclfmylczzhrv.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwbGhkbXJ6Y2xmbXlsY3p6aHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTgzMzIsImV4cCI6MjEwNTY3NDMzMn0.fPUlyxTc4lSLmaY6OZcq_z0ZGpdl4jMy7yflMDQH2aQ';
  const TABLE = 'reklamfiguren_bud';
  let sb = null, rows = new Map();
  const justAdded = new Map();

  function rebuild() {
    const byUser = new Map();
    for (const r of rows.values()) {
      const u = byUser.get(r.bidder) || { spots: {} };
      const prev = u.spots[r.spot];
      if (!prev || r.amount > prev.amount) u.spots[r.spot] = { brand: r.brand, amount: r.amount, t: Date.parse(r.created_at) || 0 };
      byUser.set(r.bidder, u);
    }
    bidsByUser = byUser;
  }
  async function loadAll() {
    const { data, error } = await sb.from(TABLE).select('id,spot,brand,amount,bidder,created_at').order('amount', { ascending: false }).limit(2000);
    if (error) throw error;
    const next = new Map(data.map(r => [r.id, r]));
    for (const [id, t] of justAdded) { if (Date.now() - t > 20000) justAdded.delete(id); else if (!next.has(id) && rows.has(id)) next.set(id, rows.get(id)); }
    rows = next; rebuild(); render(false);
  }
  remoteSave = async (spot, brand, amount) => {
    const { data, error } = await sb.from(TABLE).insert({ spot, brand, amount, bidder: me }).select('id,spot,brand,amount,bidder,created_at').single();
    if (error) {
      loadAll().catch(() => {});
      throw { userMessage: error.code === 'P0001' ? error.message : 'Budet kunde inte sparas. Kontrollera anslutningen och försök igen.' };
    }
    rows.set(data.id, data); justAdded.set(data.id, Date.now()); rebuild();
  };

  (async () => {
    if (!window.supabase) return goLocal();
    let id = store.get('reklamfiguren-bidder');
    if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => { const r = Math.random() * 16 | 0; return (ch === 'x' ? r : (r & 3 | 8)).toString(16); }); store.set('reklamfiguren-bidder', id); }
    me = id; mode = 'shared';
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
    const note = $('sync-note');
    note.textContent = 'Hämtar budlistan…';
    render(false);
    try {
      await loadAll();
      note.textContent = 'Live. Alla som besöker sidan ser samma budlista i realtid.'; note.dataset.state = 'live';
    } catch (e) {
      note.textContent = 'Budlistan svarar inte just nu. Ladda om sidan om en stund.'; note.dataset.state = 'warn';
    }
    sb.channel('reklamfiguren').on('postgres_changes', { event: 'INSERT', schema: 'public', table: TABLE }, p => {
      rows.set(p.new.id, p.new); rebuild(); render(false);
    }).subscribe();
    setInterval(() => { if (!document.hidden) loadAll().catch(() => {}); }, 30000);
  })();
})();
</script>
